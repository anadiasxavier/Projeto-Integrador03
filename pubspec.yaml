# Define tudo o que o projeto precisa para funcionar
name: rpg_campus_puc
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  video_player: ^2.9.1
  audioplayers: ^5.2.1  # Última versão
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/personagem.png
    - assets/puc.png
    - assets/personagemfeminina.png
    - assets/arena.png
    - assets/biblioteca.png
    - assets/praca.png
    - assets/mescla.png
    - assets/manacas.png
    - assets/reactions/
    - assets/bibli.mp4
    - assets/audio/arena.mp3
    - assets/guardia_biblioteca.png
    - assets/guardiao.png
    - assets/guardiao/arenaguardiao.png
    - assets/guardiao/pracaguardiao.png
    - assets/pucdia.png
    - assets/guardiao/manacasguardiao.png
    - assets/final.png
 
  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf